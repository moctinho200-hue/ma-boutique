<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>univers chic optimiste</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="carte">
    <h1>Sandales D'hommes</h1>
    <p>Confort - Qualité - style</p>
    <p class="prix">25 000 FCFA</p>

    <div class="quantite">
      <button id="moins">-</button>
      <span id="quantite">1</span>
      <button id="plus">+</button>
    </div>

    <p>Total : <strong id="total">5 000</strong> FCFA</p>
    <button id="acheter">Acheter</button>
    <p id="message"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
